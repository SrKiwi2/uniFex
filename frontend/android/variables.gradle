ext {
    minSdkVersion = 23
    // 36 y no el 35 que genera Capacitor por defecto: en esta maquina solo estan instaladas
    // las plataformas android-36 y 36.1, y no hay `cmdline-tools`, asi que Gradle no puede
    // descargar la 35 y la compilacion fallaria pidiendo un SDK que no se puede obtener.
    // Si algun dia se instala cmdline-tools, se puede volver al valor por defecto.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}
# Perfil de DESARROLLO — copia local de la BD (restaurada desde produccion).
# Activar con: mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
# NO toca la BD de produccion. hbm2ddl=none => Hibernate nunca altera el esquema;
# los cambios de esquema (Fase 1) se haran con scripts SQL controlados.

spring.datasource.url=jdbc:postgresql://localhost:5433/bd_fexpo_produccion4
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Uploads locales de desarrollo (evita escribir en C:/uniFex de produccion).
# Ruta Linux real: esta maquina de desarrollo no es Windows pese a lo que dice CLAUDE.md,
# y "C:/uniFex/dev/uploads" se interpretaba como ruta RELATIVA aqui, creando un directorio
# literal "C:" en la raiz del repo cada vez que alguien subia un archivo (paso varias veces).
app.upload-root=/home/usic-12/uniFex-dev/uploads
spring.servlet.multipart.location=/home/usic-12/uniFex-dev/tmp

# Valores locales de los secretos (en produccion vienen de variables de entorno)
pasarela.key=AccessKey dev-local-no-usar
pasarela.successUrl=https://localhost:7676/venta
pasarela.cancelUrl=https://localhost:7676/venta
pasarela.notifyUrl=https://localhost:7676/venta
api.key=dev-api-key
unifex.jwt.secret=dev-secret-solo-local-cambiar-en-produccion-1234567890

# Seed local de admin1/admin2 (en produccion vienen de ADMIN1_PASSWORD/ADMIN2_PASSWORD)

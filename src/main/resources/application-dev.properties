# Perfil de DESARROLLO — copia local de la BD (restaurada desde produccion).
# Activar con: mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
# NO toca la BD de produccion. hbm2ddl=none => Hibernate nunca altera el esquema;
# los cambios de esquema (Fase 1) se haran con scripts SQL controlados.

spring.datasource.url=jdbc:postgresql://localhost:5432/v2_fexpo_uap
spring.datasource.username=postgres
spring.datasource.password=Srkiwi2.0
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Uploads locales de desarrollo (evita escribir en C:/uniFex de produccion)
app.upload-root=C:/uniFex/dev/uploads
spring.servlet.multipart.location=C:/uniFex/dev/tmp

# Valores locales de los secretos (en produccion vienen de variables de entorno)
pasarela.key=AccessKey dev-local-no-usar
api.key=dev-api-key
unifex.jwt.secret=dev-secret-solo-local-cambiar-en-produccion-1234567890


spring.output.ansi.enabled=always

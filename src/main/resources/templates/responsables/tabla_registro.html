<div class="card">
    <div class="card-header d-flex justify-content-lg-between">
        <h5>Registro Usuario</h5>
        <button type="button" class="btn btn-primary" onclick="cargarFormulario()" data-bs-toggle="modal"
            data-bs-target="#modalFormularioResponsable">
            <i class="fa-solid fa-user-plus"></i> Agregar responsable
        </button>
    </div>
    <div class="card-datatable table-responsive pt-0">
        <table class="table table-striped table-bordered align-middle text-center" id="data-table">
            <thead class="table-dark">
                <tr>
                <th>#</th>
                <th>Entidad</th>
                <th>Nombre Completo</th>
                <th>C.I.</th>
                <th>Foto</th>
                <th>Opciones</th>
                </tr>
            </thead>
            <tbody class="animate__animated animate__fadeIn">
                <tr th:each="resp, i : ${responsables}">
                <td th:text="${i.index + 1}"></td>
                <td th:text="${#strings.isEmpty(resp.entidadNombre) ? '—' : resp.entidadNombre}"></td>
                <td th:text="${resp.persona}"></td>
                <td th:text="${resp.ci}"></td>

                <td>
                    <span th:if="${resp.foto != null and !#strings.isEmpty(resp.foto)}">
                    <a th:href="|/files/${resp.foto}|" target="_blank">
                        <img th:src="|/files/${resp.foto}|"
                            alt="Foto"
                            class="img-thumbnail rounded-circle shadow-sm"
                            style="width:50px;height:50px;object-fit:cover;" />
                    </a>
                    </span>
                    <span th:if="${resp.foto == null or #strings.isEmpty(resp.foto)}">—</span>
                </td>

                <td>
                    <a th:href="@{/respinistracion/promotores/{id}/credencial.pdf(id=${resp.id})}"
                    class="btn btn-sm btn-outline-danger"
                    title="Generar Credencial PDF" target="_blank">
                    <i class="ti ti-file-text"></i> PDF
                    </a>
                </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    if (window.$ && $.fn.DataTable) {
        const id = "#data-table";
        if ($.fn.DataTable.isDataTable(id)) {
            $(id).DataTable().destroy();
        }
        $(id).DataTable({
            language: {
                sProcessing: "Procesando...",
                sLengthMenu: "Mostrar _MENU_ registros",
                sZeroRecords: "No se encontraron resultados",
                sInfo: "Mostrando _START_ a _END_ de _TOTAL_",
                sInfoEmpty: "Mostrando 0 a 0 de 0",
                sInfoFiltered: "(filtrado de _MAX_ totales)",
                sSearch: "Buscar:",
                oPaginate: {
                    sFirst: "Primero",
                    sLast: "Último",
                    sNext: "Siguiente",
                    sPrevious: "Anterior",
                },
                oAria: {
                    sSortAscending: ": Orden ascendente",
                    sSortDescending: ": Orden descendente",
                },
            },
        });
    }
</script>

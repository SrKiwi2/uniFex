<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Acceso | Feria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet"/>
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6fa;}
    .card{border-radius:1rem; max-width:420px; width:100%;}
  </style>
</head>
<body>
<div class="card shadow p-4">
  <h4 class="mb-3 text-center">Panel Administrativo</h4>

  <div th:if="${param.error}" class="alert alert-danger py-2">Credenciales inválidas</div>
  <div th:if="${param.logout}" class="alert alert-success py-2">Sesión cerrada</div>

  <form th:action="@{/login}" method="post">
    <!-- Si activas CSRF en SecurityConfig, descomenta:
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    -->
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input class="form-control" name="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input class="form-control" type="password" name="password" required>
    </div>
    <div class="d-grid">
      <button class="btn btn-primary">Ingresar</button>
    </div>
  </form>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>

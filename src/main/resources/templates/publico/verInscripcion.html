<!doctype html>

<html lang="en" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" dir="ltr"
    data-theme="theme-default" data-assets-path="../../assets/" data-template="vertical-menu-template">

<head th:replace="~{layout/head :: head}"></head>
<link rel="stylesheet" href="../../assets/css/config_general_publico.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-- VISTA PARA FUNCIONARIOS CON USUARIO -->

<body>

    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
            <div class="layout-page">
                <nav th:replace="~{layout/topbar :: topbar}"></nav>
                
                    <div class="container-xxl flex-grow-1 container-p-y" id="contenido">
                        <div class="layout-wrapper layout-content-navbar">
                            <div class="layout-container">
                                <div class="container">
                                    <div class="content-wrapper">
                                        <div class="card animated-card position-relative p-0 mb-4 overflow-hidden shadow-sm border-0" style="min-height: 200px; border-radius: 14px; background: linear-gradient(135deg, rgba(30,58,138,0.06), rgba(185,28,28,0.06));">
                                            <div class="card-body d-flex flex-column justify-content-center align-items-center text-center py-5 px-3">
                                                <!-- Nombre del sistema dinámico -->
                                                <h1 class="titulo-sistema mb-2 text-uppercase">
                                                    UNIFEXPO-UAP <span class="version">0.2</span>
                                                </h1>

                                                <p class="slogan mb-0 fst-italic d-sm-block">
                                                    Escribiendo una nueva historia con vos......
                                                </p>

                                            </div>
                                        </div>

                                        <div class="col-md">
                                            <div class="card">
                                                <h6 class="card-header" >ADJUNTAR COMPROBANTE | TOTAL A PAGAR : <b th:text="${sumaCostosPuestos + ' Bs.'}"></b></h6>
                                                <div class="card-body">
                                                    <form class="needs-validation" action="/actualizar/inscripcion" method="post">
                                                        <input type="hidden" th:field="${inscripcion.id}" />
                                                        <div class="mb-3">
                                                            <label class="form-label" for="bs-validation-name">Numero de Comprobante</label>
                                                            <input
                                                                type="number"
                                                                class="form-control"
                                                                th:field="${inscripcion.num_comprobante}"
                                                                id="bs-validation-name"
                                                                required />
                                                            <div class="valid-feedback">Dato correcto</div>
                                                            <div class="invalid-feedback">Dato requerido</div>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label class="form-label" for="bs-validation-upload-file">Adjuntar Imagen del comprobante</label>
                                                            <input type="file" class="form-control" id="bs-validation-upload-file" required />
                                                        </div>
                                                        <div class="row">
                                                            <div class="col-12">
                                                                <button type="submit" class="btn btn-success w-100 p-3">Completar Registro</button>
                                                            </div>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <footer th:replace="~{layout/footer :: footer}"></footer>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalConfirmLogout" tabindex="-1" aria-labelledby="modalConfirmLogoutLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalConfirmLogoutLabel" style="color: aliceblue;">
                        <i class="ti ti-alert-triangle me-2" style="color: aliceblue;"></i>Confirmar cierre de sesión
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-3">¿Estás seguro de que deseas cerrar sesión?</p>
                    <i class="ti ti-logout" style="font-size: 3rem; color: #dc3545;"></i>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="ti ti-x me-1"></i> Cancelar
                    </button>
                    <a href="/cerrar_sesion" class="btn btn-danger">
                        <i class="ti ti-logout me-1"></i> Sí, cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/script :: script}"></div>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

</body>

</html>

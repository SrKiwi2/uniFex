<!DOCTYPE html>

<html lang="en" class="light-style layout-navbar-fixed layout-menu-fixed layout-compact" dir="ltr"
    data-theme="theme-default" data-assets-path="../../assets/" data-template="vertical-menu-template">

<head th:replace="~{layout/head :: head}"></head>
<link rel="stylesheet" href="../../assets/css/config_general_publico.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

<!-- VISTA PUBLICA -->

<body data-ctx="admin">
    <!-- NAVBAR -->
    <div class="container" style="padding-top: 70px">
        <nav th:fragment="topbar"
            class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
            id="layout-navbar">
            <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
                <div class="navbar-nav align-items-center">
                    <a class="nav-item nav-link search-toggler d-flex align-items-center px-0"
                        href="javascript:void(0);">
                        <i class="ti ti-search ti-md me-2"></i>
                        <span class="d-none d-md-inline-block text-muted">Buscar (Ctrl+/)</span>
                    </a>
                </div>

                <ul class="navbar-nav flex-row align-items-center ms-auto">
                    <!-- Login -->
                    <li class="nav-item" th:if="${session.persona == null}">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#modalLogin">
                            <i class="ti ti-login me-2"></i> Iniciar sesión
                        </a>
                    </li>

                    <!-- Usuario logueado -->
                    <li class="nav-item dropdown" th:if="${session.persona != null}">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#"
                            data-bs-toggle="dropdown">
                            <span class="rounded-circle d-inline-flex justify-content-center align-items-center me-2"
                                style="width:32px;height:32px;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-weight:600;">
                                <span
                                    th:text="${(#strings.substring((session.persona?.nombre?:'A'),0,1) + (#strings.substring((session.persona?.paterno?:'Z'),0,1))).toUpperCase()}">AZ</span>
                            </span>
                            <span th:text="${session.persona?.nombre}">Usuario</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li class="px-3 py-2 small text-muted">
                                <i class="ti ti-shield me-1"></i><span th:text="${session.nombre_rol}">ROL</span>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="#" data-bs-toggle="modal"
                                    data-bs-target="#modalConfirmLogout">
                                    <i class="ti ti-logout me-2"></i> Cerrar sesión
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
        <br />
    </div>

    <!-- MODAL DE LOGIN -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card animate__animated animate__fadeInDown">
                <div class="modal-header border-0 pb-0">
                    <h4 class="modal-title mx-auto d-flex align-items-center gap-3 text-primary-emphasis">
                        <img src="../../assets/img/logo/logoUap.png" alt="Logo UAP" style="height: 50px" />
                        <span>Inicia Sesión - UNIFEXPO-UAP👋</span>
                    </h4>
                </div>
                <div class="modal-body p-5 pt-3">
                    <form id="formularioLogin" action="/iniciar-sesion" method="post" class="row g-4">
                        <div class="col-12">
                            <label class="form-label fw-bold text-secondary">Usuario</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white border-end-0"><i class="ti ti-user"></i></span>
                                <input type="text" name="usuario" class="form-control border-start-0"
                                    placeholder="Tu usuario" required />
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold text-secondary">Contraseña</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white border-end-0"><i class="ti ti-lock"></i></span>
                                <input type="password" name="contrasena" id="contrasena"
                                    class="form-control border-start-0" placeholder="••••••••" required />
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                    tabindex="-1">
                                    <i class="ti ti-eye-off" id="iconToggle"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-gradient w-100 btn-lg">
                                <i class="ti ti-login me-2"></i>Ingresar al sistema
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- CERRAR SESIÓN -->
    <div class="modal fade" id="modalConfirmLogout" tabindex="-1" aria-labelledby="modalConfirmLogoutLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalConfirmLogoutLabel" style="color: aliceblue">
                        <i class="ti ti-alert-triangle me-2" style="color: aliceblue"></i>Confirmar cierre de sesión
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body text-center">
                    <p class="mb-3">¿Estás seguro de que deseas cerrar sesión?</p>
                    <i class="ti ti-logout" style="font-size: 3rem; color: #dc3545"></i>
                </div>

                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="ti ti-x me-1"></i> Cancelar
                    </button>
                    <a href="/cerrar_sesion" class="btn btn-danger">
                        <i class="ti ti-logout me-1"></i> Sí, cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">
            <div class="container">
                <div class="content-wrapper">
                    <div class="card animated-card position-relative p-0 mb-4 overflow-hidden shadow-sm border-0"
                        style="min-height: 200px; border-radius: 14px; background: linear-gradient(135deg, rgba(30,58,138,0.06), rgba(185,28,28,0.06));">

                        <!-- Contenido central -->
                        <div
                            class="card-body d-flex flex-column justify-content-center align-items-center text-center py-5 px-3">
                            <!-- Nombre del sistema dinámico -->
                            <h1 class="titulo-sistema mb-2 text-uppercase">
                                UNIFEXPO <span class="version">0.1</span>
                            </h1>

                            <p class="slogan mb-0 fst-italic d-sm-block">
                                Escribiendo una nueva historia con vos...
                            </p>

                        </div>
                        
                    </div>

                    <footer th:replace="~{layout/footer :: footer}"></footer>
                </div>
                
            </div>
        </div>
    </div>

    <div th:replace="~{layout/script_publico :: script_publico}"></div>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />

</body>

</html>

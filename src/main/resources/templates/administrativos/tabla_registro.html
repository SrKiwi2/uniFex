<div class="card">
    <div class="card-header d-flex justify-content-lg-between">
        <h5>Registro Responsables</h5>
    </div>
    <div class="card-datatable table-responsive pt-0">
        <table class="table table-striped table-bordered align-middle text-center" id="data-table">
            <thead class="table-dark">
                <tr>
                <th>#</th>
                <th>Nombre Completo</th>
                <!-- <th>Código</th>  Quitar si ya no aplica -->
                <th>C.I.</th>
                <th>Foto</th>
                <th>Opciones</th>
                </tr>
            </thead>
            <tbody class="animate__animated animate__fadeIn">
                <tr th:each="adm, i : ${promotores}">
                <td th:text="${i.index + 1}"></td>
                <td th:text="${adm.persona}"></td>

                <!-- Si quitaste la columna Código, omite esta celda; si la dejas, usa '—' -->
                <!-- <td>—</td> -->

                <td th:text="${adm.ci}"></td>

                <td>
                    <span th:if="${adm.foto != null and !#strings.isEmpty(adm.foto)}">
                    <a th:href="|/files/${adm.foto}|" target="_blank">
                        <img th:src="|/files/${adm.foto}|"
                            alt="Foto"
                            class="img-thumbnail rounded-circle shadow-sm"
                            style="width:50px;height:50px;object-fit:cover;" />
                    </a>
                    </span>
                    <span th:if="${adm.foto == null or #strings.isEmpty(adm.foto)}">—</span>
                </td>

                <td>
                    <a th:href="@{/administracion/promotores/{id}/credencial.pdf(id=${adm.id})}"
                    class="btn btn-sm btn-outline-danger"
                    title="Generar Credencial PDF" target="_blank">
                    <i class="ti ti-file-text"></i> PDF
                    </a>
                </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    if (window.$ && $.fn.DataTable) {
        const id = "#data-table";
        if ($.fn.DataTable.isDataTable(id)) {
            $(id).DataTable().destroy();
        }
        $(id).DataTable({
            language: {
                sProcessing: "Procesando...",
                sLengthMenu: "Mostrar _MENU_ registros",
                sZeroRecords: "No se encontraron resultados",
                sInfo: "Mostrando _START_ a _END_ de _TOTAL_",
                sInfoEmpty: "Mostrando 0 a 0 de 0",
                sInfoFiltered: "(filtrado de _MAX_ totales)",
                sSearch: "Buscar:",
                oPaginate: {
                    sFirst: "Primero",
                    sLast: "Último",
                    sNext: "Siguiente",
                    sPrevious: "Anterior",
                },
                oAria: {
                    sSortAscending: ": Orden ascendente",
                    sSortDescending: ": Orden descendente",
                },
            },
        });
    }
</script>

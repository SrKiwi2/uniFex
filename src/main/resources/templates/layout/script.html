    <!-- CONFIGURACIÓN SIDEBAR -->
    <script>
        $.ajaxSetup({
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });

        var botonPulsado;
        $(document).ready(function () {

            // ventana por defecto al iniciar sesión
            if (document.body.dataset.ctx === "admin" && $("#contenido").length) {
                cargarContenido("/adm/vista-administrador");
            }
            botonPulsado = document.getElementById("opcion_admin");
            botonPulsado.classList.add("active");

            // menú de usuario
            $("#opcion_usuario").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/usuario/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_usuario");;

                botonPulsado.classList.add("active");

            });

            // menú de persona
            $("#opcion_persona").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/persona/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_persona");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_responsable").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/responsable/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_responsable");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_gaseta").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/gaseta/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_gaseta");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_sr").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/inscripcion/resumen/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_sr");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_inscripciones").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/inscripcion/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_inscripciones");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_responsables").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/responsables/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_responsables");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_credencial").click(function (e) {
                e.preventDefault();
                cargarContenido("/vistaGenerarCredenciales/");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_credencial");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_responsables_incritos").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/responsables/vistaRA");

                if (botonPulsado.classList.contains("active")) {    
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_responsables_incritos");;

                botonPulsado.classList.add("active");

            });

            $("#opcion_promotor").click(function (e) {
                e.preventDefault();
                cargarContenido("/administracion/promotor/vista");

                if (botonPulsado.classList.contains("active")) {
                    botonPulsado.classList.remove("active");
                }

                botonPulsado = document.getElementById("opcion_promotor");;

                botonPulsado.classList.add("active");

            });

            function cargarContenido(url) {

                $.ajax({
                    url: "/adm/cargar-datos",
                    method: "GET",
                    success: function () {

                        $("#contenido").html(`
                            <div class="d-flex justify-content-center">
                                <div class="spinner-border m-5 text-secondary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>`);

                        $.ajax({
                            url: url,
                            method: "GET",
                            success: function (data) {
                                $("#contenido").html(data);
                            },
                            error: function (xhr) {
                                console.error('Error en la solicitud:', xhr);
                            }
                        });
                    },
                    error: function (xhr) {
                        if (xhr.status === 401) {
                            Swal.fire({
                                title: 'Sesión expirada',
                                text: 'Tu sesión ha expirado. Por favor, inicia sesión nuevamente.',
                                icon: 'warning',
                                confirmButtonText: 'Ir al login'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    window.location.href = '/';
                                }
                            });
                        }
                    }
                });
            }
        });
    </script>

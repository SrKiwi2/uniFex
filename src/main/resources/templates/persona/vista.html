<h4 class="py-3 mb-4">
    <span class="text-muted fw-light">Menú /</span> Persona
</h4>

<div id="tablaRegistro"></div>

<div class="modal fade" id="modalFormularioPersona" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="contenidoModalPersona"></div>
    </div>
</div>

<script>
    $(document).ready(function () {
        cargarTabla();
    });

    function cargarTabla() {
        $.ajax({
            type: "POST",
            url: "/administracion/persona/tabla-registros", // Ruta del metodo del controlador en Spring Boot
            success: function (response) {
                $("#tablaRegistro").html(response); // Actualiza el contenido del div con la respuesta del servidor
            },
        });
    }

    function cargarFormulario() {
        cargarFormularioAlert(
            "/administracion/persona/formulario",
            "#contenidoModalPersona",
            "#formularioPersona"
        );
    }

    function cargarFormularioEdit(id) {
        cargarFormularioEditAlert(
            id,
            "/administracion/persona/formulario-edit",
            "#contenidoModalPersona",
            "#formularioPersona"
        );
    }

    function eliminar(nombre, id) {
        eliminarRegistroAlert(
            nombre,
            id,
            "/administracion/persona/eliminar",
            cargarTabla
        );
    }

    function manejarEnvioFormulario(selector) {
        $(selector).on("submit", function (e) {
            e.preventDefault();
            const $f = $(this);
            $.ajax({
                type: $f.attr("method") || "POST",
                url: $f.attr("action"),
                data: $f.serialize(),
                success: function (resp) {
                    if (resp === "OK") {
                        $("#modalFormularioPersona").modal("hide");
                        cargarTabla();
                        Swal.fire("Éxito", "Registro guardado", "success");
                    } else {
                        Swal.fire("Atención", resp, "warning");
                    }
                },
                error: function (xhr) {
                    const msg = xhr.responseText || "Error inesperado";
                    Swal.fire("Error", msg, "error");
                },
            });
        });
    }
</script>

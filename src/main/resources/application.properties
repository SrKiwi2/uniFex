# === Variables de entorno REQUERIDAS en produccion (perfil por defecto) ===
#   DB_PASSWORD    contrasena de PostgreSQL
#   PASARELA_KEY   AccessKey de la pasarela de pago UAP
#   API_KEY        clave del API interno (X-API-KEY)
#   JWT_SECRET     secreto para firmar los JWT (>= 32 caracteres)
# En desarrollo NO hacen falta: el perfil dev (application-dev.properties) trae valores locales.
spring.application.name=uniFex
server.port=7676
spring.datasource.url=jdbc:postgresql://virtual.uap.edu.bo:5432/v2_fexpo_uap
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.thymeleaf.cache=false

app.upload-root=C:/uniFex/uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=C:/uniFex/tmp
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB


pasarela.url=https://pasarela.uap.edu.bo/v1/pago/nuevo
pasarela.key=${PASARELA_KEY}
pasarela.successUrl=https://localhost:7676/venta
pasarela.cancelUrl=https://localhost:7676/venta
pasarela.notifyUrl=https://localhost:7676/venta

server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

api.key=${API_KEY}

# Fase 1: duracion (segundos) de la reserva temporal de una caseta (estado T)
unifex.reserva.ttl-segundos=300
# Cada cuantos ms el job libera las reservas vencidas
unifex.reserva.barrido-ms=30000

# Fase 2: JWT para el API movil/SPA
unifex.jwt.secret=${JWT_SECRET}
unifex.jwt.expiration-ms=86400000


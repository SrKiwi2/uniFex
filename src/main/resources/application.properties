# === Variables de entorno REQUERIDAS en produccion (perfil por defecto) ===
#   DB_PASSWORD      contrasena de PostgreSQL
#   API_KEY          clave del API interno (X-API-KEY)
#   JWT_SECRET       secreto para firmar los JWT (>= 32 caracteres)
#   ADMIN1_PASSWORD  contrasena inicial de admin1 (solo se usa si el usuario no existe aun)
#   ADMIN2_PASSWORD  contrasena inicial de admin2 (idem)
# Sin estas cinco la aplicacion no arranca (fail-fast), a proposito: evita que produccion
# corra con secretos por defecto conocidos publicamente en este repo.
#
# === Variables OPCIONALES (modulo de pasarela/boleteria, hoy sin usar) ===
#   PASARELA_KEY, PASARELA_URL, PASARELA_SUCCESS_URL, PASARELA_CANCEL_URL, PASARELA_NOTIFY_URL
# Si no se definen, el modulo queda inactivo (arranca igual) — ver DEPLOY.md para
# activarlo cuando se retome la boleteria con pago en linea.
#
# === Variables OPCIONALES (rutas de archivos, con default para Ubuntu) ===
#   UNIFEX_UPLOAD_ROOT, UNIFEX_TMP_DIR — ver DEPLOY.md
#
# En desarrollo NO hace falta nada de esto: el perfil dev (application-dev.properties)
# trae valores locales.
spring.application.name=uniFex
server.port=7676
spring.datasource.url=jdbc:postgresql://virtual.uap.edu.bo:5432/v2_fexpo_uap
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.thymeleaf.cache=false

# Rutas de subida (uploads) y directorio temporal de multipart. Default pensado para
# Ubuntu: crear estos directorios y darle permiso de escritura al usuario del servicio
# antes del primer arranque (ver DEPLOY.md). Sobreescribibles sin tocar este archivo.
app.upload-root=${UNIFEX_UPLOAD_ROOT:/var/lib/unifex/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${UNIFEX_TMP_DIR:/var/lib/unifex/tmp}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Seed inicial de admin1/admin2 (UniFexApplication). Solo se usa la primera vez que cada
# usuario se crea; si ya existe, no se toca — cambiar la contrasena despues es cosa del
# administrador, no de este seed.
unifex.admin.admin1-password=${ADMIN1_PASSWORD}
unifex.admin.admin2-password=${ADMIN2_PASSWORD}

# PENDIENTE: boleteria por pasarela de pago, sin conectar a la SPA todavia (ver PLAN.md,
# Bloque 8). Vacio por defecto para que la aplicacion arranque sin este modulo activo;
# definir las variables de entorno cuando se retome.
pasarela.url=${PASARELA_URL:https://pasarela.uap.edu.bo/v1/pago/nuevo}
pasarela.key=${PASARELA_KEY:}
pasarela.successUrl=${PASARELA_SUCCESS_URL:}
pasarela.cancelUrl=${PASARELA_CANCEL_URL:}
pasarela.notifyUrl=${PASARELA_NOTIFY_URL:}

server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

api.key=${API_KEY}

# Fase 1: duracion (segundos) de la reserva temporal de una caseta (estado T)
unifex.reserva.ttl-segundos=300
# Cada cuantos ms el job libera las reservas vencidas
unifex.reserva.barrido-ms=30000

# Fase 2: JWT para el API movil/SPA
unifex.jwt.secret=${JWT_SECRET}
unifex.jwt.expiration-ms=86400000

# A donde apunta el QR de la nota de venta. Vacio = el QR lleva solo el codigo (se puede
# teclear a mano en el verificador). Con la URL publica del sistema, escanear la nota abre
# la comprobacion directa, que es lo que hace util el codigo en la puerta.
# Ejemplo: https://fexpo.uap.edu.bo/verificar?c=
unifex.nota.verificacion-url=${NOTA_VERIFICACION_URL:}

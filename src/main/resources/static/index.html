<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>UniFexpo – Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const w = 2000, h = 1500;
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1 });
        const bounds = [[0, 0], [h, w]];
        L.imageOverlay('/assets/ruta.png', bounds).addTo(map);
        map.fitBounds(bounds);

        fetch('/api/map/areas').then(r => r.json()).then(fc => {
            L.geoJSON(fc, {
                style: f => ({ weight: 1, fillOpacity: .35, color: '#333', fillColor: '#6aa' }),
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindTooltip(p.name || 'Área');
                }
            }).addTo(map);
        });

        const colorByType = t => ({
            STAND: '#6aa',
            BAÑO: '#4caf50',
            ESCENARIO: '#f39c12',
            INFO: '#3498db'
        }[t] || '#999');

        fetch('/api/map/areas').then(r => r.json()).then(fc => {
            L.geoJSON(fc, {
                style: f => ({
                    weight: 1,
                    fillOpacity: .35,
                    color: '#333',
                    fillColor: colorByType(f.properties.type)
                }),
                onEachFeature: (f, layer) => {
                    const p = f.properties;
                    layer.bindPopup(`
                        <b>${p.name}</b><br>
                        <small>Tipo: ${p.type}</small>
                    `);
                    layer.bindTooltip(p.name || 'Área');
                }
            }).addTo(map);
        });

    </script>
</body>

</html>
